# The `bench` catalog service. Paste everything from `bench:` down, as it is, into
# KubeCoderDeploy's chart/values.yaml under `controllerConfig.services`, after `pilot-sync`; it is
# indented for that place. Both stages run the same image, so config/<stage>/values.yaml gets
# nothing. The image floats on `latest`: Jenkins job FirmwareBench pushes it from main, and every
# environment start resolves it to a digest, so a new build needs no commit in KubeCoderDeploy.
    bench:
      # The firmware bench (pvginkel/FirmwareBench): a Node server that flashes the ESP32 on the
      # operator's desk and records its serial log, through a page in the operator's Chrome that
      # holds the USB port over Web Serial. The page, its WebSocket and the job images are on 3520,
      # which the selecting repo publishes with its own `ports:` entry: only that form has
      # sslOffload, and Web Serial needs https. The agent API is on 127.0.0.1:3521 and is never
      # published. No `ports` here, as for pilot-sync: the repo's entry types the page port. The
      # server's defaults (3520, 3521, /work, /work/.bench) need no env.
      # The image floats on the tracking `latest` tag, which every env start composes by digest
      # (D274), so a rebuilt image reaches an environment at its next start.
      description: >-
        bench — flash and debug the ESP32 on the operator's desk; what replaces idf.py flash and monitor in a pod.
      instructions: |-
        The bench: flash the ESP32 on the operator's desk and read its serial
        log. Its manual, the API calls, error codes and log format included, is
        the kubecoder:bench skill: load it before you flash. The API is on
        http://127.0.0.1:3521 from any container in this pod, the log at
        /work/.bench/serial.log, and the operator's page at
        https://bench.<env-id>.home (<env-id> is $KUBECODER_ENVIRONMENT_ID).
        When GET /status shows no holder connected, ask the operator to open it.
      container:
        image: registry:5000/firmware-bench:latest
        # No securityContext: the pod's uid runs it, so the log it writes under /work/.bench is the
        # agent's to read, where a root sidecar would leave it root-owned.
        # No memory request — the pod composer books it at 0 (D124) so capacity is governed
        # solely by the env count cap; the limit still caps usage. Measured 2026-11-22 on the real
        # board: 74 MiB peak RSS (VmHWM), 22 MiB of it anonymous, after a flash, a reset and 5,400
        # log lines; the limit leaves 1.7x of that.
        resources:
          limits: { memory: 128Mi }
      # The build directories it flashes are under /work, and so is its log.
      mountWork: true
      # No dataPath: the log lives under /work, which survives a restart.
